openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai-meals
    description: AI meal guidance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/meal-assistant:
    post:
      operationId: createAiMealAssistant
      tags: [ai-meals]
      summary: Generate personalized meal guidance
      description: Generates meal suggestions or analyzes a meal, menu, or food-label image using the user's logged food and symptom context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiMealAssistantInput"
      responses:
        "200":
          description: AI meal guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMealAssistantResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many AI requests from this client IP
          headers:
            Retry-After:
              description: Seconds until another request may be attempted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiMealAssistantInput:
      type: object
      properties:
        mode:
          type: string
          enum: [suggestions, scan]
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack, any]
        preferences:
          type: string
          maxLength: 1000
        prompt:
          type: string
          maxLength: 1000
        safeFoods:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100
        triggerFoods:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100
        recentMeals:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        recentSymptoms:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        redFlagSymptoms:
          type: array
          maxItems: 7
          items:
            type: string
            enum:
              - blood_in_stool
              - severe_pain
              - persistent_vomiting
              - fainting
              - dehydration
              - high_fever
              - cannot_keep_fluids_down
        gutState:
          type: string
          enum: [steady, sensitive, flare, recovering, unknown]
        learningHistory:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        imageBase64:
          type: string
          description: Base64-encoded image, capped at the length of an 8 MiB decoded payload.
          maxLength: 11184812
        imageMimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required:
        - mode
        - mealType
        - preferences
        - prompt
        - safeFoods
        - triggerFoods
        - recentMeals
        - recentSymptoms
        - redFlagSymptoms
        - gutState
        - learningHistory
    AiMealEvidence:
      type: object
      properties:
        stage:
          type: string
          enum: [captured, pattern, personal, current]
        signal:
          type: string
          enum: [support, caution, unknown]
        title:
          type: string
        detail:
          type: string
      required:
        - stage
        - signal
        - title
        - detail
    AiMealContextUsed:
      type: object
      properties:
        safeFoods:
          type: integer
        triggerFoods:
          type: integer
        recentMeals:
          type: integer
        symptomCheckIns:
          type: integer
        learningEvents:
          type: integer
      required:
        - safeFoods
        - triggerFoods
        - recentMeals
        - symptomCheckIns
        - learningEvents
    AiMealSuggestion:
      type: object
      properties:
        title:
          type: string
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        description:
          type: string
        ingredients:
          type: array
          items:
            type: string
        preparation:
          type: string
        rationale:
          type: string
      required:
        - title
        - mealType
        - description
        - ingredients
        - preparation
        - rationale
    AiMealAssistantResult:
      type: object
      properties:
        headline:
          type: string
        overview:
          type: string
        personalFitLevel:
          type: string
          enum: [good_fit, use_caution, high_caution, unclear]
        confidence:
          type: string
          enum: [low, medium, high]
        guidanceAction:
          type: string
          enum: [eat, limit, swap, avoid, observe, seek_care]
        guidanceSummary:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AiMealEvidence"
        contextUsed:
          $ref: "#/components/schemas/AiMealContextUsed"
        detectedFoods:
          type: array
          items:
            type: string
        considerations:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AiMealSuggestion"
        swaps:
          type: array
          items:
            type: string
        watchFor:
          type: array
          items:
            type: string
        learningPrompt:
          type: string
        disclaimer:
          type: string
      required:
        - headline
        - overview
        - personalFitLevel
        - confidence
        - guidanceAction
        - guidanceSummary
        - evidence
        - contextUsed
        - detectedFoods
        - considerations
        - suggestions
        - swaps
        - watchFor
        - learningPrompt
        - disclaimer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

